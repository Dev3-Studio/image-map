[package]
name = "collage-maker"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
avif = "0.0.0"
image = { version = "0.24.8", features = ["webp-encoder", "avif-encoder", "avif"] }
nasm-rs = "0.3.0"
walkdir = "2.4.0"
rand = { version = "0.8.5", features = [] }
serde_json = { version = "1.0.111", features = [] }
#webp = "0.2.6"
serde = { version = "1.0.104", features = ["derive"] }

[features]


[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true